name: LogBook CI/CD Pipeline

on:
    push:
        branches: ['main']

env:
    REGISTRY: ghcr.io
    # GitHub Container Registry 이미지 이름 형식: ghcr.io/계정명/레포지토리명/서비스명
    FRONT_IMAGE: ghcr.io/${{ github.repository }}/frontend
    BACK_IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # 1. 버전 관리 (GEMINI.md 수칙: 배포 전 버전 업데이트 및 config.js 생성)
            - name: Auto Versioning & Config Sync
              id: versioning
              run: |
                  cd logBook
                  # 버전 패치 (0.1.3 -> 0.1.4 등)
                  npm version patch --no-git-tag-version
                  VERSION=$(node -p "require('./package.json').version")
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
                  # 프론트엔드에서 참조할 버전 파일 생성
                  echo "export const VERSION = '$VERSION';" > src/config.js
                  echo "🚀 Updated to version: $VERSION"

            # 2. 백엔드 빌드 (Java 21 / Gradle)
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'
                  cache: 'gradle'

            - name: Build Backend with Gradle
              run: |
                  cd spring
                  chmod +x gradlew
                  ./gradlew build -x test

            # 3. Docker Registry (GHCR) 로그인
            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 4. 프론트엔드 이미지 빌드 및 푸시
            - name: Build and Push Frontend Image
              uses: docker/build-push-action@v5
              with:
                  context: ./logBook
                  push: true
                  tags: |
                      ${{ env.FRONT_IMAGE }}:latest
                      ${{ env.FRONT_IMAGE }}:${{ env.VERSION }}

            # 5. 백엔드 이미지 빌드 및 푸시
            - name: Build and Push Backend Image
              uses: docker/build-push-action@v5
              with:
                  context: ./spring
                  push: true
                  tags: |
                      ${{ env.BACK_IMAGE }}:latest
                      ${{ env.BACK_IMAGE }}:${{ env.VERSION }}

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            # 6. SSH를 통한 서버 실배포
            - name: SSH Remote Deployment
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  script: |
                      # 서버의 배포 경로로 이동
                      cd ~/logbook/images/logbook

                      # 최신 이미지 풀 및 컨테이너 재시작
                      docker compose pull
                      docker compose up -d

                      # 미사용 이미지 정리 (디스크 용량 확보)
                      docker image prune -f

                      echo "✅ Deployment of version ${{ env.VERSION }} successful!"
