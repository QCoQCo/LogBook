name: LogBook CI/CD Pipeline

on:
    push:
        branches: ['f/bbb']

env:
  REGISTRY: ghcr.io
  # 도커 이미지 이름은 반드시 소문자여야 하므로 대문자를 소문자로 직접 수정합니다.
  FRONT_IMAGE: ghcr.io/qcoqco/logbook/frontend
  BACK_IMAGE: ghcr.io/qcoqco/logbook/backend

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # 1. 버전 관리 (GEMINI.md 수칙: 배포 전 버전 업데이트 및 config.js 생성)
            - name: Auto Versioning & Config Sync
              id: versioning
              run: |
                  cd logBook
                  # 버전 패치 (0.1.3 -> 0.1.4 등)
                  npm version patch --no-git-tag-version
                  VERSION=$(node -p "require('./package.json').version")
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
                  # 프론트엔드에서 참조할 버전 파일 생성
                  echo "export const VERSION = '$VERSION';" > src/config.js
                  echo "🚀 Updated to version: $VERSION"

            # 2. 백엔드 빌드 (Java 21 / Gradle)
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'
                  cache: 'gradle'

            - name: Build Backend with Gradle
              run: |
                  cd spring
                  chmod +x gradlew
                  ./gradlew build -x test

            # 3. Docker Registry (GHCR) 로그인
            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 4. 프론트엔드 이미지 빌드 및 푸시
            - name: Build and Push Frontend Image
              uses: docker/build-push-action@v5
              with:
                  context: ./logBook
                  push: true
                  tags: |
                      ${{ env.FRONT_IMAGE }}:latest
                      ${{ env.FRONT_IMAGE }}:${{ env.VERSION }}

            # 5. 백엔드 이미지 빌드 및 푸시
            - name: Build and Push Backend Image
              uses: docker/build-push-action@v5
              with:
                  context: ./spring
                  push: true
                  tags: |
                      ${{ env.BACK_IMAGE }}:latest
                      ${{ env.BACK_IMAGE }}:${{ env.VERSION }}

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            # 1. 설계도 파일(docker-compose.yml)을 서버로 전송 (SCP)
            - name: Copy docker-compose.yml via SCP
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  password: ${{ secrets.SERVER_PASSWORD }}
                  port: ${{ secrets.SERVER_PORT }}
                  source: "docker-compose.yml"
                  target: "C:/Users/logbook/images/logbook" # 윈도우 절대 경로 (슬래시 사용)

            # 2. SSH를 통한 서버 실배포
            - name: SSH Remote Deployment
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  password: ${{ secrets.SERVER_PASSWORD }}
                  port: ${{ secrets.SERVER_PORT }}
                  script: |
                      cd /d "C:/Users/logbook/images/logbook"
                      echo --- Docker Login ---
                      echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
                      
                      echo --- Deployment ---
                      # 이미지 이름을 환경변수로 강제 주입하며 실행
                      set FRONT_IMAGE=${{ env.FRONT_IMAGE }}
                      set BACK_IMAGE=${{ env.BACK_IMAGE }}
                      docker compose pull
                      docker compose up -d
                      
                      echo --- Check Status ---
                      docker ps -a
