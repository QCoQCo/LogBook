name: LogBook CI/CD Pipeline

on:
    push:
        branches: ['main']

env:
    REGISTRY: ghcr.io
    FRONT_IMAGE: ghcr.io/qcoqco/logbook/frontend
    BACK_IMAGE: ghcr.io/qcoqco/logbook/backend

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Auto Versioning & Config Sync
              id: versioning
              run: |
                  cd logBook
                  npm version patch --no-git-tag-version
                  VERSION=$(node -p "require('./package.json').version")
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
                  echo "export const VERSION = '$VERSION';" > src/config.js

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'
                  cache: 'gradle'

            - name: Build Backend with Gradle
              run: |
                  cd spring
                  chmod +x gradlew
                  ./gradlew build -x test

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and Push Frontend Image
              uses: docker/build-push-action@v5
              with:
                  context: ./logBook
                  push: true
                  platforms: linux/arm64
                  build-args: |
                      VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
                      VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
                      VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
                      VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
                      VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
                      VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
                      VITE_FIREBASE_APP_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_APP_MEASUREMENT_ID }}
                      VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
                  tags: |
                      ${{ env.FRONT_IMAGE }}:latest
                      ${{ env.FRONT_IMAGE }}:${{ env.VERSION }}

            - name: Build and Push Backend Image
              uses: docker/build-push-action@v5
              with:
                  context: ./spring
                  push: true
                  platforms: linux/arm64
                  tags: |
                      ${{ env.BACK_IMAGE }}:latest
                      ${{ env.BACK_IMAGE }}:${{ env.VERSION }}

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Copy docker-compose.yml via SCP
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_PORT }}
                  source: 'docker-compose.yml'
                  target: '/home/ubuntu/logbook/'

            - name: SSH Remote Deployment
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_PORT }}
                  script: |
                      cd /home/ubuntu/logbook

                      # Docker Registry Login
                      echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin

                      # Pull new images and restart containers
                      sudo docker compose pull
                      sudo docker compose up -d --force-recreate

                      # Clean up unused images to save disk space
                      sudo docker image prune -f

                      # Check status
                      sudo docker ps -a
