spring:
    application:
        name: logbook
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 10MB
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: update
            naming:
                physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
                implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.MySQLDialect #방언 설정
        defer-datasource-initialization: true
    sql:
        init:
            mode: always

    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: ${GOOGLE_CLIENT_ID}
                        client-secret: ${GOOGLE_CLIENT_SECRET}
                        scope:
                            - email
                            - profile
                    kakao:
                        client-id: ${KAKAO_CLIENT_ID}
                        client-secret: ${KAKAO_CLIENT_SECRET}
                        client-authentication-method: client_secret_post
                        authorization-grant-type: authorization_code
                        redirect-uri: '{baseUrl}/{action}/oauth2/code/{registrationId}'
                        scope:
                            - profile_nickname
                            - account_email
                        client-name: Kakao
                    naver:
                        client-id: ${NAVER_CLIENT_ID}
                        client-secret: ${NAVER_CLIENT_SECRET}
                        client-authentication-method: client_secret_post
                        authorization-grant-type: authorization_code
                        redirect-uri: '{baseUrl}/{action}/oauth2/code/{registrationId}'
                        scope:
                            - name
                            - email
                            - profile_image
                        client-name: Naver
                provider:
                    kakao:
                        authorization-uri: https://kauth.kakao.com/oauth/authorize
                        token-uri: https://kauth.kakao.com/oauth/token
                        user-info-uri: https://kapi.kakao.com/v2/user/me
                        user-name-attribute: id
                    naver:
                        authorization-uri: https://nid.naver.com/oauth2.0/authorize
                        token-uri: https://nid.naver.com/oauth2.0/token
                        user-info-uri: https://openapi.naver.com/v1/nid/me
                        user-name-attribute: response

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${SMTP_USERNAME}
        password: ${SMTP_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
logging:
    level:
        org.hibernate.SQL: debug # 실행 SQL 로그 레벨
        org.hibernate.orm.jdbc.bind: trace # SQL에 담긴 실제 파라미터(값) 확인
        org.springframework.web.servlet.resource.ResourceHttpRequestHandler: ERROR # 리소스 미발견 로그 숨김

server:
    port: 8080
    servlet:
        context-path: /api

file:
    upload:
        host: ${SFTP_HOST}
        port: ${SFTP_PORT}
        username: ${SFTP_USERNAME}
        password: ${SFTP_PASSWORD}
        uploadPath: ${SFTP_UPLOADPATH}

llm:
    google:
        api-key: ${LLM_GOOGLE_API_KEY}
        models: 'gemini-2.0-flash,gemini-2.0-flash-lite,gemini-2.0-flash-001'

app:
    oauth2:
        authorized-redirect-uris: http://localhost:5173/oauth2/redirect,http://proxogus.codns.com:9008/oauth2/redirect

youtube:
    api-key: ${YOUTUBE_API_KEY:}

yt-dlp:
    path: ${YT_DLP_PATH:yt-dlp}
