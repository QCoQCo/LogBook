plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.skull'
version = '0.0.1-SNAPSHOT'
description = 'Blog service for developers'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	
	// SFTP 접속을 위한 JSch 라이브러리 추가
	implementation 'com.jcraft:jsch:0.1.55'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()

	def envFile = file('../.env')
	if (envFile.exists()) {
		envFile.eachLine { line ->
			line = line.trim()
			if (line && !line.startsWith('#') && line.contains('=')) {
				def (key, value) = line.split('=', 2)
				// 변경점: System.setProperty -> systemProperty
				// 소괄호()를 빼고, Gradle DSL 문법으로 작성합니다.
				systemProperty key.trim(), value.trim().replaceAll(/^"|"$/, '')
			}
		}
	} else {
		println "Warning: .env file not found at ${envFile.absolutePath}"
	}
}

tasks.named('bootRun') {
	def envFile = file('../.env')
	if (envFile.exists()) {
		envFile.eachLine { line ->
			line = line.trim()
			if (line && !line.startsWith('#') && line.contains('=')) {
				def (key, value) = line.split('=', 2)
				// 변경점: System.setProperty -> systemProperty
				// 소괄호()를 빼고, Gradle DSL 문법으로 작성합니다.
				systemProperty key.trim(), value.trim().replaceAll(/^"|"$/, '')
			}
		}
	} else {
		println "Warning: .env file not found at ${envFile.absolutePath}"
	}
}
