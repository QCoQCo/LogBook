services:
  backend:
    image: ${BACK_IMAGE:-ghcr.io/qcoqco/logbook/backend:latest}
    container_name: logbook-api
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=logbook
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - logbook-network

  frontend:
    image: ${FRONT_IMAGE:-ghcr.io/qcoqco/logbook/frontend:latest}
    container_name: logbook-web
    restart: always
    ports:
      - "8084:80" # 외부 접속 포트를 8084로 설정
    depends_on:
      - backend
    networks:
      - logbook-network

  db:
    image: mysql:8.0
    container_name: logbook-db
    restart: always
    environment:
      - MYSQL_DATABASE=logbook
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logbook-network

networks:
  logbook-network:
    driver: bridge
